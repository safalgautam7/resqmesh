services:
  db:
    image: postgres:16
    container_name: resqmesh_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: resqmesh
      POSTGRES_PASSWORD: resqmesh
      POSTGRES_DB: resqmesh
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resqmesh"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
